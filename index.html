<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KIMIX</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app">
    <header class="mode-header">
      <button class="mode-btn" data-mode="now">Now Playing</button>
      <button class="mode-btn" data-mode="playlist">Playlist</button>
      <button class="mode-btn active" data-mode="editor">Editor</button>
    </header>

    <section id="panel-now" class="panel">
      <div class="now-wrap">
        <div class="now-art">
          <div class="now-glow"></div>
          <div class="now-initials">KIMIX</div>
        </div>
        <div class="now-info">
          <h1 id="now-title">No track loaded</h1>
          <p id="now-subtitle">Open Playlist mode to add tracks</p>
          <div class="now-progress">
            <input id="now-seek" type="range" min="0" max="0" value="0">
            <div class="now-time">
              <span id="now-pos">0:00</span>
              <span id="now-dur">0:00</span>
            </div>
          </div>
          <div class="now-controls">
            <button id="now-prev-btn">Prev</button>
            <button id="now-play-btn">Play</button>
            <button id="now-next-btn">Next</button>
          </div>
        </div>
      </div>
    </section>

    <section id="panel-playlist" class="panel">
      <div class="playlist-layout">
        <div class="playlist-card">
          <div class="playlist-head">
            <h2>Library</h2>
            <label class="file-btn">Add Tracks
              <input id="playlist-add-input" type="file" accept="audio/*" multiple>
            </label>
          </div>
          <div id="playlist-library" class="list"></div>
        </div>
        <div class="playlist-card">
          <div class="playlist-head">
            <h2>Queue</h2>
            <div class="playlist-actions">
              <button id="queue-clear-btn">Clear</button>
            </div>
          </div>
          <div id="playlist-queue" class="list"></div>
          <div class="playlist-footer">
            <button id="queue-play-btn">Play Queue</button>
            <button id="queue-stop-btn">Stop</button>
          </div>
        </div>
      </div>
    </section>

    <section id="panel-editor" class="panel active">
      <div class="toolbar toolbar-top">
        <button id="new-project-btn">New Project</button>
        <label class="file-btn">Open Project
          <input id="open-project-input" type="file" accept=".kimixweb.json,application/json">
        </label>
        <button id="save-project-btn">Save Project As</button>
        <button id="undo-btn">Undo</button>
        <button id="redo-btn">Redo</button>
        <select id="project-select"></select>
        <label class="file-btn">Add Audio
          <input id="add-audio-input" type="file" accept="audio/*" multiple>
        </label>
        <button id="record-btn" disabled>Record</button>
        <button id="play-pause-btn">Play</button>
        <button id="stop-btn">Stop</button>
        <button id="export-btn">Export</button>
        <button id="mute-track-btn">Mute/Unmute Row</button>
      </div>

      <div class="transport">
        <input id="seek-slider" type="range" min="0" max="0" value="0">
      </div>

      <div class="grid-controls">
        <div class="field"><span>Duration:</span><strong id="duration-label">0.00 s</strong></div>
        <div class="field"><span>Position:</span><strong id="position-label">0.00 s</strong></div>

        <label>Start (s or mm:ss):<input id="start-input" value="0.0"></label>
        <label>End (s or mm:ss):<input id="end-input" value="0.0"></label>

        <label>Speed:
          <select id="speed-select">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="0.75">0.75x</option>
            <option value="1" selected>1.0x</option>
            <option value="1.25">1.25x</option>
            <option value="1.5">1.5x</option>
            <option value="1.75">1.75x</option>
            <option value="2">2.0x</option>
          </select>
        </label>
        <label class="check"><input id="pitch-checkbox" type="checkbox"> Pitch Changes With Speed</label>
        <label class="check"><input id="fade-checkbox" type="checkbox" checked> Fade Spliced Clips</label>
        <label>Fade ms:<input id="fade-input" value="40"></label>

        <label>Volume Boost (dB):
          <select id="boost-select">
            <option value="0">+0 dB</option>
            <option value="3">+3 dB</option>
            <option value="6">+6 dB</option>
            <option value="9">+9 dB</option>
            <option value="12">+12 dB</option>
            <option value="15">+15 dB</option>
            <option value="18">+18 dB</option>
          </select>
        </label>
        <label class="check"><input id="noise-checkbox" type="checkbox"> Reduce Background Noise</label>

        <button id="reverse-btn">Reverse Selected Clip To New Row</button>

        <label>Track Volume (dB):
          <input id="track-volume-slider" type="range" min="-24" max="12" value="0">
          <span id="track-volume-value">+0 dB</span>
        </label>

        <label>Clip Volume (dB):
          <input id="clip-volume-slider" type="range" min="-24" max="12" value="0">
          <span id="clip-volume-value">+0 dB</span>
        </label>

        <label>Timeline Zoom:
          <input id="zoom-input" type="range" min="10" max="320" value="100">
          <span id="zoom-value">100%</span>
        </label>
      </div>

      <div id="status-label" class="status">Drag clips across rows into Final Product. Hold Ctrl while dragging to disable snap.</div>

      <div class="toolbar toolbar-ops">
        <button id="cut-btn">Cut</button>
        <button id="copy-btn">Copy</button>
        <button id="paste-btn">Paste</button>
        <button id="delete-btn">Delete</button>
        <button id="split-btn">Split</button>
      </div>

      <div class="timeline-shell">
        <div id="timeline-scroll" class="timeline-scroll">
          <canvas id="timeline-canvas"></canvas>
        </div>
      </div>
    </section>
  </div>

  <script src="./app.js"></script>
</body>
</html>
